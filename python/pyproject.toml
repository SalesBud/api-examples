[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salesbud-api-examples"
version = "1.0.0"
description = "Runnable examples for the Salesbud API"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[tool.setuptools]
packages = ["salesbud"]
